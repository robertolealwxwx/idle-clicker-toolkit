```ini
[General]
# Path to the Cookie Clicker executable
game_path = "C:\\Program Files\\CookieClicker\\CookieClicker.exe"
# The delay between clicks in milliseconds
click_delay = 10
# Whether to start clicking on app launch
auto_start = true

[Hotkeys]
# Hotkey to start/stop auto clicking
toggle_hotkey = "F9"
# Hotkey to reset cookies
reset_hotkey = "F10"
# Hotkey to toggle upgrades
upgrade_hotkey = "F11"

[Features]
# Enable cookies per second display
enable_cps_display = true
# Requesting whether to buy the best upgrade automatically
auto_buy_upgrades = true
# Auto click on golden cookies
auto_click_golden = true
# Enable the clicking of seasonal cookies
click_seasonal_cookies = true

[Display]
# Enable/disable sound effects for clicks
sound_effects = true
# Display position of the click counter (X,Y)
click_counter_position = "100,100"
# Set transparency level for the application window (0-255)
window_transparency = 200
```